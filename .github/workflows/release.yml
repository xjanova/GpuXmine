name: build-and-release

# Tag a commit `v1.2.3` and everything downstream follows on its own:
#   GitHub Release  →  Velopack feed  →  installed clients update themselves
#                   →  XMAN Studio's product sync picks the release up within
#                      10 minutes and the website serves the new download.
#
# The website is NOT in the update path for existing installs — Velopack reads
# this release directly. XMAN Studio tracks the same release so that first-time
# downloads, the version shown on the product page and the licence/device
# registry all agree with what the fleet is actually running.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (no leading v)'
        required: true

permissions:
  contents: write

env:
  # Must match the Velopack package reference in GpuxMine.Core.csproj. A vpk
  # that is newer than the library writes a feed the installed client cannot
  # read, and the only symptom is a fleet that quietly stops updating.
  VPK_VERSION: '0.0.1298'

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ github.event.inputs.version }}'
          } else {
            '${{ github.ref_name }}' -replace '^v', ''
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            # Velopack and PHP's version_compare both need a plain three-part
            # version. Catching it here beats shipping a release the fleet
            # cannot compare against what it is running.
            throw "Version '$version' must be MAJOR.MINOR.PATCH"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "building $version"

      - name: Build and test
        shell: pwsh
        run: |
          dotnet build -c Release -p:Version=${{ steps.version.outputs.version }} --nologo
          dotnet test -c Release --no-build --nologo

      # The Windows client — the thing a node owner actually installs, and the
      # only artifact in the self-update path.
      - name: Publish client (win-x64)
        shell: pwsh
        run: |
          dotnet publish src/GpuxMine.App/GpuxMine.App.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} `
            -p:PublishSingleFile=false `
            -o publish/client

      # Headless, for a rig with no desktop session. Shipped as a zip: it is
      # not in the Velopack feed, and updates by being replaced.
      - name: Publish agent (win-x64, headless)
        shell: pwsh
        run: |
          dotnet publish src/GpuxMine.Agent/GpuxMine.Agent.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish/agent-win
          Compress-Archive -Path publish/agent-win/* -DestinationPath gpuxmine-agent-win-x64.zip

      # Linux rigs are a large slice of the supply (mining boxes idle since the
      # merge), and the agent is headless by design — no UI project is involved.
      - name: Publish agent (linux-x64)
        shell: pwsh
        run: |
          dotnet publish src/GpuxMine.Agent/GpuxMine.Agent.csproj `
            -c Release -r linux-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish/agent-linux
          Compress-Archive -Path publish/agent-linux/* -DestinationPath gpuxmine-agent-linux-x64.zip

      - name: Publish relay
        shell: pwsh
        run: |
          dotnet publish src/GpuxMine.Relay/GpuxMine.Relay.csproj `
            -c Release -r linux-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.version }} `
            -o publish/relay
          Compress-Archive -Path publish/relay/* -DestinationPath gpuxmine-relay-linux-x64.zip

      - name: Pack the client with Velopack
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version $env:VPK_VERSION
          vpk pack `
            --packId GpuxMine `
            --packVersion ${{ steps.version.outputs.version }} `
            --packDir publish/client `
            --mainExe GPUxMINE.exe `
            --packTitle "GPUxMINE" `
            --packAuthors "XMAN Studio" `
            --icon src/GpuxMine.App/Assets/gpuxmine.ico
          Get-ChildItem Releases | Format-Table Name, Length

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GPUxMINE v${{ steps.version.outputs.version }}
          generate_release_notes: true
          # Asset names are load-bearing. Velopack reads Releases/*; anything
          # that renames these silently breaks self-update for every installed
          # node, and nobody finds out until someone checks a version by hand.
          files: |
            Releases/*
            gpuxmine-agent-win-x64.zip
            gpuxmine-agent-linux-x64.zip
            gpuxmine-relay-linux-x64.zip
