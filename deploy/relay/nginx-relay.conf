# relay.xman4289.com:8443 — the address every shared GPU dials
#
# What production on the TPIX server runs, as RELAY-DEPLOY.md records it
# (/etc/nginx/sites-available/gpuxmine-relay.conf) — port 8443, $http_host,
# X-Forwarded-Proto https. The earlier copy of this file still had the three
# settings that broke the first install; they are marked FIXED below.
# Redeploying from an older copy brings those bugs back, so when production
# changes, change this file with it (diff the two before a reload).
#
# NOT for the xman4289 web server: that box runs Apache (apache-relay.conf).
#
# Port 8443, not 443: on the TPIX box 443 is open to Cloudflare's addresses
# only, and the relay must be reachable directly (Cloudflare cuts responses
# slower than 100 s, and does not proxy 8443 at all).
#
# `sudo nginx -t` before every reload — a broken file left here also breaks
# certbot's automatic renewal reload, for every site on the machine.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ACME + redirect. Nothing else is served on plain HTTP.
server {
    listen 80;
    listen [::]:80;
    server_name relay.xman4289.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    # FIXED: no `http2 on;` — that directive is nginx 1.25.1+, the server runs
    # 1.24, and `nginx -t` rejects it. HTTP/2 buys nothing here anyway: nodes
    # dial a WebSocket and aixman fetches over HTTP/1.1.
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name relay.xman4289.com;

    ssl_certificate     /etc/letsencrypt/live/relay.xman4289.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.xman4289.com/privkey.pem;

    access_log /var/log/nginx/gpuxmine-relay.access.log;

    # Request bodies only (uploads aixman sends to a node). Kept equal to the
    # relay's own Relay__MaxRequestBodyBytes (32 MiB) so the two refuse the
    # same thing; replies are not limited by this at all.
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;

        # The agent holds one websocket open for as long as it is sharing.
        # Without these two lines nginx answers the handshake with a plain 200
        # and the node can never connect.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # What the relay builds every enrolment URL from.
        # FIXED: $http_host, never $host — $host drops the port, so the relay
        # handed out wss://relay.xman4289.com/agent (no :8443) and every node
        # knocked on the closed 443.
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-Host  $http_host;
        # FIXED: without this the relay hands out ws:// and http:// URLs, and
        # aixman refuses an endpoint that is not https.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        # The relay's rate limits count this address (Relay__TrustProxy=true).
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Time between two reads, not a cap on the whole request. The relay's
        # own limit is 180 s of silence from the node; this sits above it so
        # the relay is the one that decides. The websocket is never idle this
        # long: the relay pings every 20 s.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Replies stream through as the node sends them instead of being
        # spooled to disk first.
        proxy_buffering off;
    }
}
