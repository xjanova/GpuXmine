# relay.xman4289.com — the address every shared GPU dials
#
# DirectAdmin writes its own vhosts, so this belongs in a custom include rather
# than in a file DirectAdmin will overwrite:
#   /usr/local/directadmin/data/users/admin/nginx.conf   (or a custom/ include)
# On a plain nginx box, /etc/nginx/conf.d/relay.conf is fine.
#
# Get the certificate first (certbot, or DirectAdmin's Let's Encrypt for the
# subdomain). A node connects with wss:// and aixman calls https://, so there
# is no working configuration without TLS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name relay.xman4289.com;

    ssl_certificate     /etc/letsencrypt/live/relay.xman4289.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.xman4289.com/privkey.pem;

    # A rendered video comes back through this proxy in one response.
    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;

        # The agent holds one websocket open for as long as it is sharing.
        # Without these two lines nginx answers the handshake with a plain 200
        # and the node can never connect.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # What the relay builds every enrolment URL from. Get these wrong and
        # nodes are handed ws://relay… and endpoints http://relay…, which
        # aixman rejects — the node enrols and is never sent a job.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # A render can take minutes — Wan 2.1 measured at 185 s on an 8 GB card,
        # and SDXL at 279 s on the same one. nginx's 60 s default would cut the
        # customer's job off mid-render and blame the node for it. The relay's
        # own ceiling is 180 s per request; this sits above it so the relay is
        # the one that decides.
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;

        # Streams the reply through instead of spooling a finished video to disk
        # before sending a byte of it.
        proxy_buffering off;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name relay.xman4289.com;
    return 301 https://$host$request_uri;
}
