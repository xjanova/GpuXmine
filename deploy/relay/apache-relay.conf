# relay.xman4289.com → 127.0.0.1:5080   (DirectAdmin + Apache)
#
# ที่อยู่ของไฟล์นี้: ไฟล์ CUSTOM ต่อโดเมนของ DirectAdmin
#   /usr/local/directadmin/data/users/admin/domains/relay.xman4289.com.conf.CUSTOM.<N>
# แล้ว  da build rewrite_confs
#
# เลข <N> คือจุดแทรกในเทมเพลต ใช้เลขเดียวกับที่ ai.xman4289.com ใช้อยู่แล้ว
# (ดูคำสั่งหาเลขในไฟล์ docs/RELAY-DEPLOY.md) — เครื่องนี้พร็อกซี Next.js ไป
# 127.0.0.1:3001 ด้วยกลไกเดียวกันนี้มาตั้งแต่ปี 2026 แล้ว
#
# public_html ของโดเมนนี้ปล่อยว่างไว้ ไม่มีไฟล์อะไรถูกเสิร์ฟจากดิสก์เลย
# ทุก request ถูกส่งต่อให้ relay ทั้งหมด

<IfModule mod_proxy.c>
    ProxyRequests Off
    # relay สร้าง URL ลงทะเบียนจาก Host ที่ได้รับ ถ้าไม่ preserve จะกลายเป็น
    # 127.0.0.1 แล้วทุกเครื่องจะได้ URL ที่ต่อกลับมาไม่ได้
    ProxyPreserveHost On

    # เวลาสูงสุดที่ Apache รอ relay ตอบ
    #
    # 60 วินาที (ค่า default) ตัดงานกลางคัน — วัดจริงบนการ์ด 8 GB: Wan 2.1
    # ใช้ 185 วิ, SDXL ใช้ 279 วิ ตัว relay เองมีเพดาน 180 วิต่อ request
    # ค่านี้จึงตั้งสูงกว่าเพื่อให้ relay เป็นคนตัดสินใจ ไม่ใช่ Apache
    ProxyTimeout 300

    # ขนาด body ของ request (ไฟล์ที่ aixman อัปโหลดไปให้เครื่อง) ตั้งให้เท่ากับ
    # Relay__MaxRequestBodyBytes ของ relay (32 MiB) สองชั้นจะได้ปฏิเสธสิ่งเดียวกัน
    # ค่า default ของ Apache คือ 1 GB ซึ่งปล่อยให้ relay ต้องรับของที่ไม่มีทางผ่าน
    LimitRequestBody 33554432

    # --- WebSocket ---
    # เครื่องที่บ้านเปิด socket นี้ค้างไว้ตลอดเวลาที่แชร์การ์ด
    # ต้องเปิด mod_proxy_wstunnel ไม่งั้น upgrade ไม่ผ่านและไม่มีเครื่องไหนต่อติดเลย
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} =websocket [NC]
    RewriteRule ^/?(.*) "ws://127.0.0.1:5080/$1" [P,L]

    # --- HTTP ธรรมดา ---
    ProxyPass        / http://127.0.0.1:5080/ timeout=300 keepalive=On
    ProxyPassReverse / http://127.0.0.1:5080/
</IfModule>

# Apache ใส่ X-Forwarded-For และ X-Forwarded-Host ให้เอง แต่ **ไม่ใส่
# X-Forwarded-Proto** ซึ่งเป็นตัวเดียวที่บอก relay ว่าฝั่งนอกเป็น https
#
# ถ้าไม่มีบรรทัดนี้ relay จะแจก ws:// ให้ทุกเครื่อง (ต่อแบบไม่เข้ารหัสข้าม
# อินเทอร์เน็ต) และแจก endpoint เป็น http:// ซึ่ง aixman ปฏิเสธ — เครื่องจะ
# ลงทะเบียนสำเร็จแล้วไม่เคยได้งานสักชิ้น โดยไม่มีอะไรบอกว่าทำไม
#
# ไฟล์นี้ต้องอยู่ใน vhost ฝั่ง SSL เท่านั้น ถ้าเอาไปใส่ฝั่งพอร์ต 80 ด้วย
# จะกลายเป็นโกหก relay ว่า http คือ https
<IfModule mod_headers.c>
    RequestHeader set X-Forwarded-Proto "https"
</IfModule>
